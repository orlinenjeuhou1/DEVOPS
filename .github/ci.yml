
name: CI Pipeline
on:
  pull_request:
    branches: [dev]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker images
        run: docker-compose build
      - name: Run tests (si tests présents)
        run: |
          if [ -d "tests" ]; then pytest tests/; fi
