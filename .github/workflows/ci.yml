name: CI Pipeline

on:
  pull_request:
    branches: [dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js (React client)
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build React app (si dossier client existe)
        run: |
          if [ -d "client" ]; then
            cd client
            npm install
            npm run build
          else
            echo "Pas de dossier client, build React ignoré"
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Poetry et dépendances backend (si server existe)
        run: |
          if [ -d "server" ]; then
            pip install poetry
            cd server
            poetry install
          else
            echo "Pas de dossier server, backend ignoré"
          fi

      - name: Run Django tests (si manage.py existe)
        run: |
          if [ -f "server/manage.py" ]; then
            cd server
            poetry run python manage.py test
          else
            echo "Aucun test Django à lancer"
          fi
